<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640"
     viewBox="0 0 1440 640"
     font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif">
  <title>Choice migration in analytical placement</title>
  <desc>Three panels: a choice class of equivalent MFFCs; placement at iteration t with the
        active alternative and seeded candidates around a shared anchor; and migration to a
        new active alternative at iteration t+1 using boundary-anchored seeds and a warm start.</desc>

  <defs>
    <marker id="arrowTeal" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1440" height="640" fill="#ffffff"/>

  <!-- ============================== (a) choice graph ============================== -->
  <g id="panel-a">
    <text x="30" y="40" font-size="18" font-weight="700" fill="#0f172a">(a) Choice graph</text>

    <!-- shared boundary leaves -->
    <g stroke="#475569" stroke-width="1.4" fill="#e2e8f0">
      <rect x="60" y="164" width="12" height="12" rx="2"/>
      <rect x="60" y="244" width="12" height="12" rx="2"/>
      <rect x="60" y="324" width="12" height="12" rx="2"/>
      <rect x="60" y="404" width="12" height="12" rx="2"/>
    </g>
    <g stroke="#94a3b8" stroke-width="1.2">
      <line x1="72" y1="170" x2="100" y2="170"/>
      <line x1="72" y1="250" x2="100" y2="250"/>
      <line x1="72" y1="330" x2="100" y2="330"/>
      <line x1="72" y1="410" x2="100" y2="410"/>
    </g>
    <g font-size="12" fill="#475569" text-anchor="end">
      <text x="54" y="174">b<tspan dy="3.5" font-size="9.5">1</tspan></text>
      <text x="54" y="254">b<tspan dy="3.5" font-size="9.5">2</tspan></text>
      <text x="54" y="334">b<tspan dy="3.5" font-size="9.5">3</tspan></text>
      <text x="54" y="414">b<tspan dy="3.5" font-size="9.5">4</tspan></text>
    </g>
    <rect x="100" y="150" width="12" height="300" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>

    <!-- alternative A1 (active) -->
    <rect x="150" y="150" width="150" height="100" rx="8" fill="#dbe9f6" stroke="#1f4e79" stroke-width="2"/>
    <text x="160" y="170" font-size="13.5" font-weight="700" fill="#1f4e79">A<tspan dy="4" font-size="10">1</tspan><tspan dy="-4" dx="3.5">· active</tspan></text>
    <g stroke="#1f4e79" stroke-width="1.6" fill="none">
      <line x1="112" y1="190" x2="150" y2="190"/>
      <line x1="112" y1="215" x2="150" y2="215"/>
      <line x1="185" y1="205" x2="225" y2="188"/>
      <line x1="225" y1="188" x2="255" y2="225"/>
      <line x1="185" y1="205" x2="255" y2="225"/>
      <line x1="255" y1="225" x2="300" y2="225"/>
    </g>
    <g fill="#ffffff" stroke="#1f4e79" stroke-width="1.6">
      <circle cx="185" cy="205" r="6"/>
      <circle cx="225" cy="188" r="6"/>
      <circle cx="255" cy="225" r="6"/>
      <circle cx="300" cy="225" r="3.2" fill="#1f4e79" stroke="none"/>
    </g>

    <!-- alternative A2 (candidate) -->
    <rect x="150" y="265" width="150" height="100" rx="8" fill="#f4f5f7" stroke="#94a3b8"
          stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="160" y="285" font-size="13.5" font-weight="600" fill="#64748b">A<tspan dy="4" font-size="10">2</tspan></text>
    <g stroke="#94a3b8" stroke-width="1.3" fill="none" stroke-dasharray="5 4">
      <line x1="112" y1="300" x2="150" y2="300"/>
      <line x1="112" y1="325" x2="150" y2="325"/>
      <line x1="185" y1="330" x2="220" y2="308"/>
      <line x1="220" y1="308" x2="252" y2="335"/>
      <line x1="252" y1="335" x2="230" y2="352"/>
      <line x1="185" y1="330" x2="230" y2="352"/>
      <line x1="252" y1="335" x2="300" y2="320"/>
    </g>
    <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.3">
      <circle cx="185" cy="330" r="5.5"/>
      <circle cx="220" cy="308" r="5.5"/>
      <circle cx="252" cy="335" r="5.5"/>
      <circle cx="230" cy="352" r="5.5"/>
      <circle cx="300" cy="320" r="3" fill="#94a3b8" stroke="none"/>
    </g>

    <!-- alternative A3 (candidate) -->
    <rect x="150" y="380" width="150" height="100" rx="8" fill="#f4f5f7" stroke="#94a3b8"
          stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="160" y="400" font-size="13.5" font-weight="600" fill="#64748b">A<tspan dy="4" font-size="10">3</tspan></text>
    <g stroke="#94a3b8" stroke-width="1.3" fill="none" stroke-dasharray="5 4">
      <line x1="112" y1="415" x2="150" y2="415"/>
      <line x1="112" y1="440" x2="150" y2="440"/>
      <line x1="195" y1="435" x2="245" y2="435"/>
      <line x1="245" y1="435" x2="300" y2="420"/>
    </g>
    <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.3">
      <circle cx="195" cy="435" r="5.5"/>
      <circle cx="245" cy="435" r="5.5"/>
      <circle cx="300" cy="420" r="3" fill="#94a3b8" stroke="none"/>
    </g>

    <!-- common output signal -->
    <g fill="none">
      <line x1="300" y1="225" x2="325" y2="320" stroke="#1f4e79" stroke-width="2"/>
      <line x1="300" y1="320" x2="325" y2="320" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
      <line x1="300" y1="420" x2="325" y2="320" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
      <line x1="325" y1="320" x2="358" y2="320" stroke="#334155" stroke-width="2"/>
      <line x1="379" y1="320" x2="405" y2="290" stroke="#94a3b8" stroke-width="1.3"/>
      <line x1="379" y1="320" x2="405" y2="350" stroke="#94a3b8" stroke-width="1.3"/>
    </g>
    <circle cx="325" cy="320" r="3" fill="#334155"/>
    <circle cx="368" cy="320" r="11" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="368" y="325" font-size="13" font-style="italic" text-anchor="middle" fill="#0f172a">y</text>
    <rect x="405" y="278" width="36" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="405" y="338" width="36" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="423" y="390" font-size="11.5" text-anchor="middle" fill="#64748b">fanouts</text>

    <text x="225" y="518" font-size="12.5" font-style="italic" text-anchor="middle" fill="#475569">
      shared boundary L = {b<tspan dy="3" font-size="10">1</tspan><tspan dy="-3">,…,b</tspan><tspan dy="3" font-size="10">4</tspan><tspan dy="-3">} · k equivalent MFFCs</tspan>
    </text>
  </g>

  <!-- ============================== (b) placement at iteration t ============================== -->
  <g id="panel-b">
    <text x="500" y="40" font-size="18" font-weight="700" fill="#0f172a">
      (b) Placement at iteration <tspan font-style="italic">t</tspan>
    </text>

    <rect x="520" y="90" width="380" height="440" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
    <text x="532" y="112" font-size="12" fill="#94a3b8">core</text>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="596" y1="90" x2="596" y2="530"/>
      <line x1="672" y1="90" x2="672" y2="530"/>
      <line x1="748" y1="90" x2="748" y2="530"/>
      <line x1="824" y1="90" x2="824" y2="530"/>
      <line x1="520" y1="178" x2="900" y2="178"/>
      <line x1="520" y1="266" x2="900" y2="266"/>
      <line x1="520" y1="354" x2="900" y2="354"/>
      <line x1="520" y1="442" x2="900" y2="442"/>
    </g>

    <!-- placed neighbourhood -->
    <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2">
      <rect x="538" y="150" width="30" height="18" rx="3"/>
      <rect x="560" y="205" width="30" height="18" rx="3"/>
      <rect x="542" y="250" width="30" height="18" rx="3"/>
      <rect x="858" y="165" width="30" height="18" rx="3"/>
      <rect x="852" y="235" width="30" height="18" rx="3"/>
      <rect x="864" y="400" width="30" height="18" rx="3"/>
      <rect x="842" y="465" width="30" height="18" rx="3"/>
      <rect x="545" y="430" width="30" height="18" rx="3"/>
      <rect x="572" y="480" width="30" height="18" rx="3"/>
    </g>
    <!-- connectivity to the class boundary -->
    <g stroke="#cbd5e1" stroke-width="1.1">
      <line x1="553" y1="259" x2="625" y2="300"/>
      <line x1="557" y1="214" x2="625" y2="300"/>
      <line x1="860" y1="174" x2="780" y2="320"/>
      <line x1="852" y1="244" x2="780" y2="320"/>
      <line x1="560" y1="439" x2="625" y2="365"/>
    </g>

    <!-- active alternative A1 -->
    <g fill="#dbe9f6" stroke="#1f4e79" stroke-width="2">
      <rect x="628" y="258" width="36" height="22" rx="4"/>
      <rect x="688" y="242" width="36" height="22" rx="4"/>
      <rect x="652" y="352" width="36" height="22" rx="4"/>
    </g>
    <g stroke="#1f4e79" stroke-width="1.5" fill="none">
      <line x1="646" y1="269" x2="706" y2="253"/>
      <line x1="706" y1="253" x2="670" y2="363"/>
      <line x1="646" y1="269" x2="670" y2="363"/>
    </g>
    <g stroke="#1f4e79" stroke-width="1.1" fill="none" opacity="0.75">
      <line x1="646" y1="269" x2="700" y2="320"/>
      <line x1="706" y1="253" x2="700" y2="320"/>
      <line x1="670" y1="363" x2="700" y2="320"/>
    </g>
    <text x="622" y="244" font-size="12" font-weight="600" fill="#1f4e79">A<tspan dy="3.5" font-size="9.5">1</tspan><tspan dy="-3.5" dx="3">active</tspan></text>

    <!-- shared anchor, drawn on top of the class nets -->
    <circle cx="700" cy="320" r="13" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
    <circle cx="700" cy="320" r="5" fill="#d97706"/>
    <text x="700" y="298" font-size="12" font-weight="600" text-anchor="middle" fill="#f8fafc"
          stroke="#f8fafc" stroke-width="4" stroke-linejoin="round">output anchor</text>
    <text x="700" y="298" font-size="12" font-weight="600" text-anchor="middle" fill="#b45309">output anchor</text>

    <!-- seeded candidates A2 / A3 -->
    <g fill="#f4f5f7" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4">
      <rect x="738" y="258" width="36" height="22" rx="4"/>
      <rect x="764" y="318" width="36" height="22" rx="4"/>
      <rect x="722" y="376" width="36" height="22" rx="4"/>
      <rect x="748" y="196" width="36" height="22" rx="4"/>
      <rect x="778" y="232" width="36" height="22" rx="4"/>
    </g>
    <text x="744" y="248" font-size="11.5" fill="#64748b">A<tspan dy="3.5" font-size="9.5">2</tspan></text>
    <text x="804" y="190" font-size="11.5" fill="#64748b">A<tspan dy="3.5" font-size="9.5">3</tspan></text>

    <text x="710" y="552" font-size="11.5" text-anchor="middle" fill="#1f4e79">
      solid: active — counted in density and legalization
    </text>
    <text x="710" y="571" font-size="11.5" text-anchor="middle" fill="#64748b">
      dashed: seeded candidates — evaluation only
    </text>
  </g>

  <!-- selection arrow between (b) and (c) -->
  <g>
    <line x1="906" y1="330" x2="988" y2="330" stroke="#334155" stroke-width="2.4" marker-end="url(#arrowSlate)"/>
    <text x="948" y="316" font-size="12.5" text-anchor="middle" fill="#334155">select</text>
    <text x="948" y="354" font-size="12.5" font-weight="600" text-anchor="middle" fill="#334155">A<tspan dy="3.5" font-size="9.5">2</tspan></text>
  </g>

  <!-- ============================== (c) migration at iteration t+1 ============================== -->
  <g id="panel-c">
    <text x="980" y="40" font-size="18" font-weight="700" fill="#0f172a">
      (c) Migration at iteration <tspan font-style="italic">t</tspan>+1
    </text>

    <rect x="1000" y="90" width="380" height="440" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
    <text x="1012" y="112" font-size="12" fill="#94a3b8">core</text>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="1076" y1="90" x2="1076" y2="530"/>
      <line x1="1152" y1="90" x2="1152" y2="530"/>
      <line x1="1228" y1="90" x2="1228" y2="530"/>
      <line x1="1304" y1="90" x2="1304" y2="530"/>
      <line x1="1000" y1="178" x2="1380" y2="178"/>
      <line x1="1000" y1="266" x2="1380" y2="266"/>
      <line x1="1000" y1="354" x2="1380" y2="354"/>
      <line x1="1000" y1="442" x2="1380" y2="442"/>
    </g>

    <!-- placed neighbourhood (unchanged) -->
    <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2">
      <rect x="1018" y="150" width="30" height="18" rx="3"/>
      <rect x="1040" y="205" width="30" height="18" rx="3"/>
      <rect x="1022" y="250" width="30" height="18" rx="3"/>
      <rect x="1338" y="165" width="30" height="18" rx="3"/>
      <rect x="1332" y="235" width="30" height="18" rx="3"/>
      <rect x="1344" y="400" width="30" height="18" rx="3"/>
      <rect x="1322" y="465" width="30" height="18" rx="3"/>
      <rect x="1025" y="430" width="30" height="18" rx="3"/>
      <rect x="1052" y="480" width="30" height="18" rx="3"/>
    </g>
    <g stroke="#cbd5e1" stroke-width="1.1">
      <line x1="1033" y1="259" x2="1105" y2="300"/>
      <line x1="1037" y1="214" x2="1105" y2="300"/>
      <line x1="1340" y1="174" x2="1260" y2="320"/>
      <line x1="1332" y1="244" x2="1260" y2="320"/>
      <line x1="1040" y1="439" x2="1105" y2="365"/>
    </g>

    <!-- per-alternative explanation cache -->
    <rect x="1075" y="100" width="290" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="1220" y="119" font-size="11.5" text-anchor="middle" fill="#475569">
      per-alternative cache: HPWL · congestion · slack
    </text>
    <text x="1220" y="136" font-size="11.5" text-anchor="middle" fill="#475569">
      dirty only when the boundary moves &gt; ε
    </text>

    <!-- ghost of the old alternative A1 -->
    <g fill="#f4f5f7" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4">
      <rect x="1108" y="258" width="36" height="22" rx="4"/>
      <rect x="1168" y="242" width="36" height="22" rx="4"/>
      <rect x="1132" y="352" width="36" height="22" rx="4"/>
    </g>
    <text x="1102" y="244" font-size="12" fill="#94a3b8">A<tspan dy="3.5" font-size="9.5">1</tspan><tspan dy="-3.5" dx="3">ghost</tspan></text>

    <!-- new active alternative A2 -->
    <g fill="#dbe9f6" stroke="#1f4e79" stroke-width="2">
      <rect x="1218" y="258" width="36" height="22" rx="4"/>
      <rect x="1244" y="318" width="36" height="22" rx="4"/>
      <rect x="1202" y="376" width="36" height="22" rx="4"/>
    </g>
    <g stroke="#1f4e79" stroke-width="1.5" fill="none">
      <line x1="1236" y1="269" x2="1262" y2="329"/>
      <line x1="1262" y1="329" x2="1220" y2="387"/>
      <line x1="1236" y1="269" x2="1220" y2="387"/>
    </g>
    <g stroke="#1f4e79" stroke-width="1.1" fill="none" opacity="0.75">
      <line x1="1236" y1="269" x2="1180" y2="320"/>
      <line x1="1262" y1="329" x2="1180" y2="320"/>
      <line x1="1220" y1="387" x2="1180" y2="320"/>
    </g>
    <text x="1212" y="244" font-size="12" font-weight="600" fill="#1f4e79">A<tspan dy="3.5" font-size="9.5">2</tspan><tspan dy="-3.5" dx="3">active</tspan></text>

    <!-- invariant shared anchor, drawn on top of the class nets -->
    <circle cx="1180" cy="320" r="13" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
    <circle cx="1180" cy="320" r="5" fill="#d97706"/>

    <!-- migration seeds: boundary-anchored affine + topological centroid -->
    <g stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrowTeal)">
      <path d="M1126,269 C1150,255 1185,255 1210,267"/>
      <path d="M1186,253 C1205,275 1225,300 1238,315"/>
      <path d="M1150,363 C1168,385 1185,394 1198,390"/>
    </g>
    <text x="1215" y="212" font-size="11.5" text-anchor="middle" fill="#0f766e">
      boundary-anchored affine + centroid seed
    </text>

    <text x="1190" y="552" font-size="11.5" text-anchor="middle" fill="#1f4e79">
      anchor invariant → local re-place only
    </text>
    <text x="1190" y="571" font-size="11.5" text-anchor="middle" fill="#64748b">
      warm start with μ-annealed anchors (μ: high → 0)
    </text>
  </g>

  <!-- ============================== legend ============================== -->
  <g id="legend" font-size="12.5" fill="#475569">
    <rect x="198" y="584" width="26" height="16" rx="3" fill="#dbe9f6" stroke="#1f4e79" stroke-width="1.8"/>
    <text x="232" y="597">active alternative</text>

    <rect x="452" y="584" width="26" height="16" rx="3" fill="#f4f5f7" stroke="#94a3b8"
          stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="486" y="597">seeded candidate</text>

    <circle cx="744" cy="592" r="9" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <circle cx="744" cy="592" r="3.5" fill="#d97706"/>
    <text x="760" y="597">class output anchor</text>

    <line x1="1032" y1="592" x2="1072" y2="592" stroke="#0f766e" stroke-width="2"
          marker-end="url(#arrowTeal)"/>
    <text x="1082" y="597">seed migration (warm start)</text>
  </g>
</svg>
