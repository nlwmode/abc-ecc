<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540"
     viewBox="0 0 720 540"
     font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif">
  <title>Choice migration in analytical placement</title>
  <desc>Three panels: a choice class of equivalent MFFCs; placement at iteration t with the
        active alternative and seeded candidates around a shared anchor; and migration to a
        new active alternative at iteration t+1 using boundary-anchored seeds and a warm start.</desc>

  <defs>
    <marker id="arrowTeal" markerWidth="8" markerHeight="7" refX="7" refY="3.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowSlate" markerWidth="8" markerHeight="7" refX="7" refY="3.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="720" height="540" fill="#ffffff"/>

  <!-- ============================== (a) choice graph ============================== -->
  <g id="panel-a">
    <text x="14" y="18" font-size="14" font-weight="700" fill="#0f172a">(a) Choice graph</text>

    <!-- shared boundary leaves -->
    <g stroke="#475569" stroke-width="1.2" fill="#e2e8f0">
      <rect x="22" y="70" width="10" height="10" rx="2"/>
      <rect x="22" y="115" width="10" height="10" rx="2"/>
      <rect x="22" y="160" width="10" height="10" rx="2"/>
      <rect x="22" y="205" width="10" height="10" rx="2"/>
    </g>
    <g stroke="#94a3b8" stroke-width="1.1">
      <line x1="32" y1="75" x2="42" y2="75"/>
      <line x1="32" y1="120" x2="42" y2="120"/>
      <line x1="32" y1="165" x2="42" y2="165"/>
      <line x1="32" y1="210" x2="42" y2="210"/>
    </g>
    <g font-size="9.5" fill="#475569" text-anchor="end">
      <text x="18" y="79">b<tspan dy="3" font-size="8">1</tspan></text>
      <text x="18" y="124">b<tspan dy="3" font-size="8">2</tspan></text>
      <text x="18" y="169">b<tspan dy="3" font-size="8">3</tspan></text>
      <text x="18" y="214">b<tspan dy="3" font-size="8">4</tspan></text>
    </g>
    <rect x="42" y="55" width="8" height="170" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.1"/>

    <!-- alternative A1 (active) -->
    <rect x="64" y="55" width="122" height="50" rx="6" fill="#dbe9f6" stroke="#1f4e79" stroke-width="1.8"/>
    <text x="69" y="68" font-size="10" font-weight="700" fill="#1f4e79">A<tspan dy="3.2" font-size="8.5">1</tspan><tspan dy="-3.2" dx="2.5">· active</tspan></text>
    <g stroke="#1f4e79" stroke-width="1.4" fill="none">
      <line x1="50" y1="70" x2="64" y2="70"/>
      <line x1="50" y1="85" x2="64" y2="85"/>
      <line x1="80" y1="90" x2="98" y2="78"/>
      <line x1="98" y1="78" x2="116" y2="90"/>
      <line x1="80" y1="90" x2="116" y2="90"/>
      <line x1="116" y1="90" x2="186" y2="90"/>
    </g>
    <g fill="#ffffff" stroke="#1f4e79" stroke-width="1.4">
      <circle cx="80" cy="90" r="3.5"/>
      <circle cx="98" cy="78" r="3.5"/>
      <circle cx="116" cy="90" r="3.5"/>
      <circle cx="186" cy="90" r="2.2" fill="#1f4e79" stroke="none"/>
    </g>

    <!-- alternative A2 (candidate) -->
    <rect x="64" y="115" width="122" height="50" rx="6" fill="#f4f5f7" stroke="#94a3b8"
          stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="69" y="127" font-size="10" font-weight="600" fill="#64748b">A<tspan dy="3" font-size="8.5">2</tspan></text>
    <g stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-dasharray="4 3">
      <line x1="50" y1="130" x2="64" y2="130"/>
      <line x1="50" y1="145" x2="64" y2="145"/>
      <line x1="82" y1="150" x2="100" y2="136"/>
      <line x1="100" y1="136" x2="118" y2="150"/>
      <line x1="118" y1="150" x2="104" y2="158"/>
      <line x1="104" y1="158" x2="82" y2="150"/>
      <line x1="118" y1="150" x2="186" y2="150"/>
    </g>
    <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.2">
      <circle cx="82" cy="150" r="3.2"/>
      <circle cx="100" cy="136" r="3.2"/>
      <circle cx="118" cy="150" r="3.2"/>
      <circle cx="104" cy="158" r="3.2"/>
      <circle cx="186" cy="150" r="2" fill="#94a3b8" stroke="none"/>
    </g>

    <!-- alternative A3 (candidate) -->
    <rect x="64" y="175" width="122" height="50" rx="6" fill="#f4f5f7" stroke="#94a3b8"
          stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="69" y="188" font-size="10" font-weight="600" fill="#64748b">A<tspan dy="3" font-size="8.5">3</tspan></text>
    <g stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-dasharray="4 3">
      <line x1="50" y1="190" x2="64" y2="190"/>
      <line x1="50" y1="205" x2="64" y2="205"/>
      <line x1="90" y1="207" x2="112" y2="207"/>
      <line x1="112" y1="207" x2="186" y2="207"/>
    </g>
    <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.2">
      <circle cx="90" cy="207" r="3.2"/>
      <circle cx="112" cy="207" r="3.2"/>
      <circle cx="186" cy="207" r="2" fill="#94a3b8" stroke="none"/>
    </g>

    <!-- common output signal -->
    <g fill="none">
      <line x1="186" y1="90" x2="205" y2="150" stroke="#1f4e79" stroke-width="1.6"/>
      <line x1="186" y1="150" x2="205" y2="150" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
      <line x1="186" y1="207" x2="205" y2="150" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
      <line x1="205" y1="150" x2="218" y2="150" stroke="#334155" stroke-width="1.6"/>
      <line x1="234" y1="150" x2="250" y2="132" stroke="#94a3b8" stroke-width="1.1"/>
      <line x1="234" y1="150" x2="250" y2="168" stroke="#94a3b8" stroke-width="1.1"/>
    </g>
    <circle cx="205" cy="150" r="2.2" fill="#334155"/>
    <circle cx="226" cy="150" r="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
    <text x="226" y="154" font-size="10" font-style="italic" text-anchor="middle" fill="#0f172a">y</text>
    <rect x="250" y="126" width="18" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1"/>
    <rect x="250" y="162" width="18" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1"/>
    <text x="259" y="190" font-size="9" text-anchor="middle" fill="#64748b">fanouts</text>

    <text x="150" y="258" font-size="9.5" font-style="italic" text-anchor="middle" fill="#475569">
      shared boundary L = {b<tspan dy="2.5" font-size="8">1</tspan><tspan dy="-2.5">,…,b</tspan><tspan dy="2.5" font-size="8">4</tspan><tspan dy="-2.5">} · k equivalent MFFCs</tspan>
    </text>
  </g>

  <!-- ============================== (b) placement at iteration t ============================== -->
  <g id="panel-b">
    <text x="330" y="18" font-size="14" font-weight="700" fill="#0f172a">
      (b) Placement at iteration <tspan font-style="italic">t</tspan>
    </text>

    <rect x="338" y="38" width="364" height="176" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="344" y="51" font-size="9" fill="#94a3b8">core</text>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="429" y1="38" x2="429" y2="214"/>
      <line x1="520" y1="38" x2="520" y2="214"/>
      <line x1="611" y1="38" x2="611" y2="214"/>
      <line x1="338" y1="82" x2="702" y2="82"/>
      <line x1="338" y1="126" x2="702" y2="126"/>
      <line x1="338" y1="170" x2="702" y2="170"/>
    </g>

    <!-- placed neighbourhood -->
    <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1">
      <rect x="350" y="66" width="20" height="12" rx="2"/>
      <rect x="366" y="96" width="20" height="12" rx="2"/>
      <rect x="350" y="126" width="20" height="12" rx="2"/>
      <rect x="676" y="72" width="20" height="12" rx="2"/>
      <rect x="670" y="102" width="20" height="12" rx="2"/>
      <rect x="682" y="174" width="20" height="12" rx="2"/>
      <rect x="662" y="186" width="20" height="12" rx="2"/>
      <rect x="350" y="180" width="20" height="12" rx="2"/>
      <rect x="376" y="190" width="20" height="12" rx="2"/>
    </g>
    <!-- connectivity to the class boundary -->
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="360" y1="132" x2="445" y2="140"/>
      <line x1="366" y1="102" x2="445" y2="140"/>
      <line x1="676" y1="78" x2="575" y2="140"/>
      <line x1="670" y1="108" x2="575" y2="140"/>
      <line x1="360" y1="186" x2="445" y2="170"/>
    </g>

    <!-- active alternative A1 -->
    <g fill="#dbe9f6" stroke="#1f4e79" stroke-width="1.7">
      <rect x="452" y="120" width="24" height="15" rx="3"/>
      <rect x="487" y="108" width="24" height="15" rx="3"/>
      <rect x="460" y="176" width="24" height="15" rx="3"/>
    </g>
    <g stroke="#1f4e79" stroke-width="1.3" fill="none">
      <line x1="464" y1="127.5" x2="499" y2="115.5"/>
      <line x1="499" y1="115.5" x2="472" y2="183.5"/>
      <line x1="464" y1="127.5" x2="472" y2="183.5"/>
    </g>
    <g stroke="#1f4e79" stroke-width="1" fill="none" opacity="0.7">
      <line x1="464" y1="127.5" x2="520" y2="150"/>
      <line x1="499" y1="115.5" x2="520" y2="150"/>
      <line x1="472" y1="183.5" x2="520" y2="150"/>
    </g>
    <text x="432" y="100" font-size="10" font-weight="600" fill="#1f4e79">A<tspan dy="3" font-size="8.5">1</tspan><tspan dy="-3" dx="2.5">active</tspan></text>

    <!-- seeded candidates A2 / A3 -->
    <g fill="#f4f5f7" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3">
      <rect x="558" y="112" width="24" height="15" rx="3"/>
      <rect x="572" y="146" width="24" height="15" rx="3"/>
      <rect x="544" y="176" width="24" height="15" rx="3"/>
      <rect x="592" y="84" width="24" height="15" rx="3"/>
      <rect x="612" y="98" width="24" height="15" rx="3"/>
    </g>
    <text x="562" y="106" font-size="9.5" fill="#64748b">A<tspan dy="3" font-size="8">2</tspan></text>
    <text x="596" y="78" font-size="9.5" fill="#64748b">A<tspan dy="3" font-size="8">3</tspan></text>

    <!-- shared anchor, drawn on top of the class nets -->
    <circle cx="520" cy="150" r="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
    <circle cx="520" cy="150" r="3.5" fill="#d97706"/>
    <text x="520" y="136" font-size="9.5" font-weight="600" text-anchor="middle" fill="#f8fafc"
          stroke="#f8fafc" stroke-width="3" stroke-linejoin="round">output anchor</text>
    <text x="520" y="136" font-size="9.5" font-weight="600" text-anchor="middle" fill="#b45309">output anchor</text>

    <text x="520" y="230" font-size="10" text-anchor="middle" fill="#1f4e79">
      solid: active — counted in density and legalization
    </text>
    <text x="520" y="244" font-size="10" text-anchor="middle" fill="#64748b">
      dashed: seeded candidates — evaluation only
    </text>
  </g>

  <!-- selection between (b) and (c) -->
  <g>
    <line x1="660" y1="222" x2="660" y2="288" stroke="#334155" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
    <text x="650" y="258" font-size="9.5" text-anchor="end" fill="#334155">select A<tspan dy="3" font-size="8">2</tspan></text>
  </g>

  <!-- ============================== (c) migration at iteration t+1 ============================== -->
  <g id="panel-c">
    <text x="330" y="300" font-size="14" font-weight="700" fill="#0f172a">
      (c) Migration at iteration <tspan font-style="italic">t</tspan>+1
    </text>

    <rect x="338" y="320" width="364" height="176" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="344" y="333" font-size="9" fill="#94a3b8">core</text>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="429" y1="320" x2="429" y2="496"/>
      <line x1="520" y1="320" x2="520" y2="496"/>
      <line x1="611" y1="320" x2="611" y2="496"/>
      <line x1="338" y1="364" x2="702" y2="364"/>
      <line x1="338" y1="408" x2="702" y2="408"/>
      <line x1="338" y1="452" x2="702" y2="452"/>
    </g>

    <!-- placed neighbourhood (unchanged) -->
    <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1">
      <rect x="350" y="348" width="20" height="12" rx="2"/>
      <rect x="366" y="378" width="20" height="12" rx="2"/>
      <rect x="350" y="408" width="20" height="12" rx="2"/>
      <rect x="676" y="354" width="20" height="12" rx="2"/>
      <rect x="670" y="384" width="20" height="12" rx="2"/>
      <rect x="682" y="456" width="20" height="12" rx="2"/>
      <rect x="662" y="468" width="20" height="12" rx="2"/>
      <rect x="350" y="462" width="20" height="12" rx="2"/>
      <rect x="376" y="472" width="20" height="12" rx="2"/>
    </g>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="360" y1="414" x2="445" y2="422"/>
      <line x1="366" y1="384" x2="445" y2="422"/>
      <line x1="676" y1="360" x2="575" y2="422"/>
      <line x1="670" y1="390" x2="575" y2="422"/>
      <line x1="360" y1="468" x2="445" y2="452"/>
    </g>

    <!-- ghost of the old alternative A1 -->
    <g fill="#f4f5f7" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3">
      <rect x="452" y="402" width="24" height="15" rx="3"/>
      <rect x="487" y="390" width="24" height="15" rx="3"/>
      <rect x="460" y="458" width="24" height="15" rx="3"/>
    </g>
    <text x="432" y="382" font-size="9.5" fill="#94a3b8">A<tspan dy="3" font-size="8">1</tspan><tspan dy="-3" dx="2.5">ghost</tspan></text>

    <!-- new active alternative A2 -->
    <g fill="#dbe9f6" stroke="#1f4e79" stroke-width="1.7">
      <rect x="558" y="394" width="24" height="15" rx="3"/>
      <rect x="572" y="428" width="24" height="15" rx="3"/>
      <rect x="544" y="458" width="24" height="15" rx="3"/>
    </g>
    <g stroke="#1f4e79" stroke-width="1.3" fill="none">
      <line x1="570" y1="401.5" x2="584" y2="435.5"/>
      <line x1="584" y1="435.5" x2="556" y2="465.5"/>
      <line x1="570" y1="401.5" x2="556" y2="465.5"/>
    </g>
    <g stroke="#1f4e79" stroke-width="1" fill="none" opacity="0.7">
      <line x1="570" y1="401.5" x2="520" y2="432"/>
      <line x1="584" y1="435.5" x2="520" y2="432"/>
      <line x1="556" y1="465.5" x2="520" y2="432"/>
    </g>
    <text x="562" y="388" font-size="10" font-weight="600" fill="#1f4e79">A<tspan dy="3" font-size="8.5">2</tspan><tspan dy="-3" dx="2.5">active</tspan></text>

    <!-- invariant shared anchor, drawn on top of the class nets -->
    <circle cx="520" cy="432" r="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
    <circle cx="520" cy="432" r="3.5" fill="#d97706"/>

    <text x="560" y="356" font-size="10" text-anchor="middle" fill="#0f766e">
      boundary-anchored affine + centroid seed
    </text>

    <!-- migration seeds: boundary-anchored affine + topological centroid -->
    <g stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#arrowTeal)">
      <path d="M499,397.5 C515,390 540,392 556,399"/>
      <path d="M464,409.5 C495,410 545,420 570,430"/>
      <path d="M472,465.5 C495,472 515,468 540,464"/>
    </g>

    <text x="520" y="510" font-size="10" text-anchor="middle" fill="#1f4e79">
      anchor invariant → local re-place only
    </text>
    <text x="520" y="524" font-size="10" text-anchor="middle" fill="#64748b">
      warm start with μ-annealed anchors (μ: high → 0)
    </text>
  </g>

  <!-- ============================== legend ============================== -->
  <g id="legend" font-size="10" fill="#475569">
    <rect x="14" y="314" width="24" height="14" rx="3" fill="#dbe9f6" stroke="#1f4e79" stroke-width="1.6"/>
    <text x="46" y="325">active alternative</text>

    <rect x="14" y="344" width="24" height="14" rx="3" fill="#f4f5f7" stroke="#94a3b8"
          stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="46" y="355">seeded candidate</text>

    <circle cx="26" cy="386" r="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
    <circle cx="26" cy="386" r="3" fill="#d97706"/>
    <text x="46" y="390">class output anchor</text>

    <line x1="14" y1="418" x2="42" y2="418" stroke="#0f766e" stroke-width="1.8"
          marker-end="url(#arrowTeal)"/>
    <text x="50" y="422">seed migration (warm start)</text>

    <text x="14" y="452" font-size="9.5" fill="#64748b">Only the active alternative enters density</text>
    <text x="14" y="466" font-size="9.5" fill="#64748b">and legalization; candidates are evaluated in place.</text>
    <text x="14" y="480" font-size="9.5" fill="#64748b">Output anchor = placed location of the shared y.</text>
    <text x="14" y="494" font-size="9.5" fill="#64748b">Costs are cached per alternative.</text>
  </g>
</svg>
